<text x="457.0" y="544" text-anchor="middle" font-size="13" fill="#374151">resume + job description</text>
<text x="457.0" y="562" text-anchor="middle" font-size="13" fill="#374151">validated, treated as data</text>
<line x1="582" y1="539" x2="615" y2="539" stroke="#374151" stroke-width="2"/>
<polygon points="624,539 613,533 613,545" fill="#374151"/>
<rect x="624" y="496" width="250" height="86" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
<text x="749.0" y="522" text-anchor="middle" font-size="17" font-weight="700" fill="#0c4a6e">Analyse</text>
<text x="749.0" y="544" text-anchor="middle" font-size="13" fill="#374151">skills, strengths, gaps,</text>
<text x="749.0" y="562" text-anchor="middle" font-size="13" fill="#374151">ATS tips (resume + JD)</text>
<line x1="874" y1="539" x2="907" y2="539" stroke="#374151" stroke-width="2"/>
<polygon points="916,539 905,533 905,545" fill="#374151"/>
<rect x="916" y="496" width="250" height="86" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
<text x="1041.0" y="522" text-anchor="middle" font-size="17" font-weight="700" fill="#0c4a6e">Match / Gap / Optimise</text>
<text x="1041.0" y="544" text-anchor="middle" font-size="13" fill="#374151">transparent score; no</text>
<text x="1041.0" y="562" text-anchor="middle" font-size="13" fill="#374151">invented skills; approvals</text>
<line x1="1166" y1="539" x2="1199" y2="539" stroke="#374151" stroke-width="2"/>
<polygon points="1208,539 1197,533 1197,545" fill="#374151"/>
<rect x="1208" y="496" width="250" height="86" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
<text x="1333.0" y="522" text-anchor="middle" font-size="17" font-weight="700" fill="#0c4a6e">Report</text>
<text x="1333.0" y="544" text-anchor="middle" font-size="13" fill="#374151">PDF or DOCX download</text>
<text x="40" y="626" text-anchor="start" font-size="15" font-weight="700" fill="#15803d">Registered user - history, learning and recognition</text>
<rect x="40" y="638" width="250" height="86" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="165.0" y="664" text-anchor="middle" font-size="17" font-weight="700" fill="#14532d">Register / sign in</text>
<text x="165.0" y="686" text-anchor="middle" font-size="13" fill="#374151">Argon2id, short JWT,</text>
<text x="165.0" y="704" text-anchor="middle" font-size="13" fill="#374151">rotating refresh cookie</text>
<line x1="290" y1="681" x2="323" y2="681" stroke="#374151" stroke-width="2"/>
<polygon points="332,681 321,675 321,687" fill="#374151"/>
<rect x="332" y="638" width="250" height="86" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
