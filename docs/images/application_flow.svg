<text x="1333.0" y="806" text-anchor="middle" font-size="17" font-weight="700" fill="#78350f">Withdraw consent</text>
<text x="1333.0" y="828" text-anchor="middle" font-size="13" fill="#374151">unpublished immediately</text>
<text x="750.0" y="908" text-anchor="middle" font-size="13" font-weight="400" fill="#6b7280">Scores are estimates, not hiring decisions. Certificates are platform-issued, not externally accredited. The platform never posts to social networks for you.</text>
