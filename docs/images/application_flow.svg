<text x="1333.0" y="664" text-anchor="middle" font-size="17" font-weight="700" fill="#14532d">Portfolio</text>
<text x="1333.0" y="686" text-anchor="middle" font-size="13" fill="#374151">private by default;</text>
<text x="1333.0" y="704" text-anchor="middle" font-size="13" fill="#374151">consent to publish</text>
<path d="M165 724 L165 746 L165 746" fill="none"/>
<text x="40" y="768" text-anchor="start" font-size="15" font-weight="700" fill="#b45309">Testimonials - consent, moderation, sharing</text>
