<text x="457.0" y="686" text-anchor="middle" font-size="13" fill="#374151">7, 15 or 60 days</text>
<text x="457.0" y="704" text-anchor="middle" font-size="13" fill="#374151">only</text>
<line x1="582" y1="681" x2="615" y2="681" stroke="#374151" stroke-width="2"/>
<polygon points="624,681 613,675 613,687" fill="#374151"/>
