<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="930" viewBox="0 0 1500 930" font-family="Arial, Helvetica, sans-serif">
<defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#374151"/></marker></defs>
<rect width="1500" height="930" fill="#ffffff"/>
<text x="750.0" y="42" text-anchor="middle" font-size="28" font-weight="700" fill="#111827">AI Career Coach - Application Flow</text>
<text x="750.0" y="66" text-anchor="middle" font-size="14" font-weight="400" fill="#4b5563">How a request travels through the platform, and how users move through it</text>
<text x="40" y="110" text-anchor="start" font-size="18" font-weight="700" fill="#4f46e5">1. Request flow</text>
<rect x="40" y="130" width="220" height="100" rx="12" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
<text x="150.0" y="156" text-anchor="middle" font-size="17" font-weight="700" fill="#1e1b4b">Browser</text>
<text x="150.0" y="178" text-anchor="middle" font-size="13" fill="#374151">React 18 + TypeScript</text>
<text x="150.0" y="196" text-anchor="middle" font-size="13" fill="#374151">access token in memory</text>
<text x="150.0" y="214" text-anchor="middle" font-size="13" fill="#374151">refresh token: HttpOnly cookie</text>
<rect x="320" y="130" width="220" height="100" rx="12" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
<text x="430.0" y="156" text-anchor="middle" font-size="17" font-weight="700" fill="#083344">Vercel</text>
<text x="430.0" y="178" text-anchor="middle" font-size="13" fill="#374151">serves the React app</text>
<text x="430.0" y="196" text-anchor="middle" font-size="13" fill="#374151">rewrites /api/* to Render</text>
<text x="430.0" y="214" text-anchor="middle" font-size="13" fill="#374151">(same-origin, first-party cookie)</text>
<rect x="600" y="130" width="300" height="100" rx="12" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
<text x="750.0" y="156" text-anchor="middle" font-size="17" font-weight="700" fill="#1e1b4b">FastAPI on Render</text>
<text x="750.0" y="178" text-anchor="middle" font-size="13" fill="#374151">security headers, CORS, correlation id</text>
<text x="750.0" y="196" text-anchor="middle" font-size="13" fill="#374151">auth: user JWT or guest token</text>
<text x="750.0" y="214" text-anchor="middle" font-size="13" fill="#374151">rate limits, input validation</text>
<rect x="960" y="130" width="230" height="100" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
<text x="1075.0" y="156" text-anchor="middle" font-size="17" font-weight="700" fill="#14532d">Services</text>
<text x="1075.0" y="178" text-anchor="middle" font-size="13" fill="#374151">deterministic analysis</text>
<text x="1075.0" y="196" text-anchor="middle" font-size="13" fill="#374151">scoring, roadmaps, assessments</text>
<text x="1075.0" y="214" text-anchor="middle" font-size="13" fill="#374151">certificates, portfolio</text>
<rect x="1250" y="130" width="210" height="100" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
<text x="1355.0" y="156" text-anchor="middle" font-size="17" font-weight="700" fill="#7f1d1d">Error envelope</text>
<text x="1355.0" y="178" text-anchor="middle" font-size="13" fill="#374151">{ error: { code, message } }</text>
<text x="1355.0" y="196" text-anchor="middle" font-size="13" fill="#374151">no values echoed</text>
<text x="1355.0" y="214" text-anchor="middle" font-size="13" fill="#374151">no internals leaked</text>
<line x1="260" y1="180" x2="311" y2="180" stroke="#374151" stroke-width="2"/>
<polygon points="320,180 309,174 309,186" fill="#374151"/>
<line x1="540" y1="180" x2="591" y2="180" stroke="#374151" stroke-width="2"/>
<polygon points="600,180 589,174 589,186" fill="#374151"/>
<line x1="900" y1="180" x2="951" y2="180" stroke="#374151" stroke-width="2"/>
<polygon points="960,180 949,174 949,186" fill="#374151"/>
<line x1="1190" y1="180" x2="1241" y2="180" stroke="#374151" stroke-width="2" stroke-dasharray="6 4"/>
<polygon points="1250,180 1239,174 1239,186" fill="#374151"/>
<text x="260" y="110" text-anchor="start" font-size="13" font-weight="400" fill="#6b7280">services call data stores and external APIs only when a feature needs them</text>
<rect x="40" y="300" width="262" height="100" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
<text x="171.0" y="326" text-anchor="middle" font-size="17" font-weight="700" fill="#7c2d12">Neon PostgreSQL</text>
<text x="171.0" y="348" text-anchor="middle" font-size="13" fill="#374151">users, documents, roadmaps,</text>
<text x="171.0" y="366" text-anchor="middle" font-size="13" fill="#374151">attempts, certificates,</text>
<text x="171.0" y="384" text-anchor="middle" font-size="13" fill="#374151">testimonials, audit log</text>
<rect x="328" y="300" width="262" height="100" rx="12" fill="#faf5ff" stroke="#9333ea" stroke-width="2"/>
<text x="459.0" y="326" text-anchor="middle" font-size="17" font-weight="700" fill="#581c87">Chroma Cloud</text>
<text x="459.0" y="348" text-anchor="middle" font-size="13" fill="#374151">document vectors</text>
<text x="459.0" y="366" text-anchor="middle" font-size="13" fill="#374151">filtered by owner id</text>
<text x="459.0" y="384" text-anchor="middle" font-size="13" fill="#374151">(guest or user)</text>
<rect x="616" y="300" width="262" height="100" rx="12" fill="#f0fdfa" stroke="#0d9488" stroke-width="2"/>
<text x="747.0" y="326" text-anchor="middle" font-size="17" font-weight="700" fill="#134e4a">Object storage (S3)</text>
<text x="747.0" y="348" text-anchor="middle" font-size="13" fill="#374151">generated reports</text>
<text x="747.0" y="366" text-anchor="middle" font-size="13" fill="#374151">certificate PDFs</text>
<text x="747.0" y="384" text-anchor="middle" font-size="13" fill="#374151">(local disk in dev)</text>
<rect x="904" y="300" width="262" height="100" rx="12" fill="#fefce8" stroke="#ca8a04" stroke-width="2"/>
<text x="1035.0" y="326" text-anchor="middle" font-size="17" font-weight="700" fill="#713f12">Groq LLM (optional)</text>
<text x="1035.0" y="348" text-anchor="middle" font-size="13" fill="#374151">narrative and coach text</text>
<text x="1035.0" y="366" text-anchor="middle" font-size="13" fill="#374151">never sets a score</text>
<text x="1035.0" y="384" text-anchor="middle" font-size="13" fill="#374151">falls back if no key</text>
<rect x="1192" y="300" width="262" height="100" rx="12" fill="#f3f4f6" stroke="#4b5563" stroke-width="2"/>
<text x="1323.0" y="326" text-anchor="middle" font-size="17" font-weight="700" fill="#111827">GitHub API (read-only)</text>
<text x="1323.0" y="348" text-anchor="middle" font-size="13" fill="#374151">project review evidence</text>
<text x="1323.0" y="366" text-anchor="middle" font-size="13" fill="#374151">code is never executed</text>
<text x="1323.0" y="384" text-anchor="middle" font-size="13" fill="#374151">api.github.com only</text>
