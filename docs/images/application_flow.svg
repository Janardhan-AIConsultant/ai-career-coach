<text x="40" y="450" text-anchor="start" font-size="18" font-weight="700" fill="#4f46e5">2. User journeys</text>
<text x="40" y="484" text-anchor="start" font-size="15" font-weight="700" fill="#0369a1">Guest - no account, session deleted on expiry</text>
<rect x="40" y="496" width="250" height="86" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
<text x="165.0" y="522" text-anchor="middle" font-size="17" font-weight="700" fill="#0c4a6e">Start session</text>
<text x="165.0" y="544" text-anchor="middle" font-size="13" fill="#374151">random 256-bit token,</text>
<text x="165.0" y="562" text-anchor="middle" font-size="13" fill="#374151">only its hash is stored</text>
<line x1="290" y1="539" x2="323" y2="539" stroke="#374151" stroke-width="2"/>
<polygon points="332,539 321,533 321,545" fill="#374151"/>
<rect x="332" y="496" width="250" height="86" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
