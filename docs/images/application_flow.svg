<text x="749.0" y="686" text-anchor="middle" font-size="13" fill="#374151">activities; server-side</text>
<text x="749.0" y="704" text-anchor="middle" font-size="13" fill="#374151">scored assessments</text>
<line x1="874" y1="681" x2="907" y2="681" stroke="#374151" stroke-width="2"/>
<polygon points="916,681 905,675 905,687" fill="#374151"/>
