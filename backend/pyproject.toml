[project]
name = "ai-career-coach-backend"
version = "0.1.0"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[[tool.mypy.overrides]]
module = ["pymupdf.*", "langchain_huggingface.*", "groq.*", "chromadb.*", "docx.*", "boto3.*", "botocore.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["app.processors.extraction", "app.rag.vector_store", "app.services.llm", "app.services.report_render", "app.services.certificate_pdf", "app.services.testimonial_card", "app.services.brand"]
disallow_untyped_calls = false  # PyMuPDF/chromadb/langchain are not fully typed
